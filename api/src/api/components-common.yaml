components:
  parameters:
    LocalMutationGuard:
      description: Local browser mutation guard. This is not an identity credential; bearer authentication, when configured, is also required.
      in: header
      name: X-Spaceweave
      required: true
      schema:
        enum:
          - "1"
        type: string
  schemas:
    File:
      properties:
        format:
          type: string
        name:
          type: string
        role:
          enum:
            - architecture
            - spaces
            - reference
          type: string
        sha256:
          type: string
        upload:
          type: string
      required:
        - role
        - upload
        - format
        - sha256
        - name
      type: object
    Floorplan:
      properties:
        attempts:
          type: integer
        confidence:
          type: number
        costUsd:
          type: number
        createdAt:
          format: date-time
          type: string
        drawing:
          type: string
        error:
          type: string
        files:
          items:
            $ref: '#/components/schemas/File'
          type: array
        format:
          type: string
        id:
          type: string
        note:
          type: string
        original:
          type: string
        progress:
          $ref: '#/components/schemas/Progress'
        scale:
          $ref: '#/components/schemas/Scale'
        sha256:
          type: string
        source:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        summary:
          type: string
        title:
          type: string
        tracer:
          type: string
        updatedAt:
          format: date-time
          type: string
        upload:
          type: string
      required:
        - id
        - title
        - status
        - source
        - upload
        - format
        - original
        - sha256
        - costUsd
        - attempts
        - createdAt
        - updatedAt
      type: object
    FloorplanPage:
      properties:
        nextCursor:
          type: string
        plans:
          items:
            $ref: '#/components/schemas/Floorplan'
          type: array
      required:
        - plans
      type: object
    Format:
      properties:
        detail:
          type: string
        drawing:
          type: boolean
        exts:
          items:
            type: string
          type: array
        id:
          type: string
        label:
          type: string
        mime:
          items:
            type: string
          type: array
      required:
        - id
        - label
        - exts
        - mime
        - drawing
      type: object
    Info:
      properties:
        formats:
          items:
            $ref: '#/components/schemas/Format'
          type: array
        maxUploadBytes:
          format: int64
          type: integer
        maxUsd:
          type: number
        model:
          type: string
        profile:
          type: string
        profiles:
          type: boolean
        tracer:
          type: string
        version:
          type: string
      required:
        - version
        - tracer
        - maxUploadBytes
        - formats
      type: object
    LayerProfile:
      additionalProperties: false
      properties:
        description:
          type: string
        rules:
          items:
            $ref: '#/components/schemas/LayerRule'
          type: array
      required:
        - rules
      type: object
    LayerRule:
      additionalProperties: false
      properties:
        codes:
          items:
            type: string
          type: array
        layer:
          type: string
        note:
          type: string
        priority:
          type: integer
        regex:
          type: string
        role:
          type: string
        squashed:
          items:
            type: string
          type: array
        with:
          items:
            type: string
          type: array
        words:
          items:
            type: string
          type: array
      required:
        - role
      type: object
    Problem:
      properties:
        detail:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
      type: object
    Processing:
      properties:
        attempt:
          type: integer
        error:
          type: string
        planId:
          type: string
        progress:
          $ref: '#/components/schemas/Progress'
        status:
          $ref: '#/components/schemas/Status'
        updatedAt:
          format: date-time
          type: string
      required:
        - planId
        - attempt
        - status
        - updatedAt
      type: object
    ProfileReply:
      properties:
        active:
          type: boolean
        builtin:
          type: boolean
        exists:
          type: boolean
        name:
          type: string
        profile:
          $ref: '#/components/schemas/LayerProfile'
        roles:
          items:
            $ref: '#/components/schemas/RoleInfo'
          type: array
      required:
        - name
        - builtin
        - exists
        - active
        - profile
        - roles
      type: object
    Progress:
      properties:
        costUsd:
          type: number
        submits:
          type: integer
        turn:
          type: integer
      required:
        - turn
        - submits
        - costUsd
      type: object
    ReviewReply:
      properties:
        plan:
          $ref: '#/components/schemas/Floorplan'
        was:
          $ref: '#/components/schemas/Status'
      required:
        - plan
        - was
      type: object
    ReviewRequest:
      additionalProperties: false
      properties:
        note:
          maxLength: 65536
          type: string
      type: object
    RoleInfo:
      properties:
        help:
          type: string
        label:
          type: string
        role:
          type: string
      required:
        - role
        - label
        - help
      type: object
    Scale:
      properties:
        assumed:
          type: boolean
        pxPerMetre:
          type: number
        pxPerPaperMm:
          type: number
      required:
        - pxPerMetre
      type: object
    Status:
      enum:
        - queued
        - converting
        - tracing
        - draft
        - approved
        - failed
      type: string
    UploadReply:
      properties:
        duplicate:
          type: boolean
        plan:
          $ref: '#/components/schemas/Floorplan'
      required:
        - plan
        - duplicate
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
