          description: Temporarily unavailable
    post:
      description: Queues a supported drawing or image for local processing. Content duplicates return the existing plan with 200. A queued plan is not approved. This operation does not implement Idempotency-Key receipts; callers reconcile uploads by returned plan or content hash before repeating an uncertain request.
