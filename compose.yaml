services:
  spaceweave:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPACEWEAVE_TRACER: auto
    volumes:
      - inbox:/app/floorplans/inbox
      - generated:/app/web/floorplan-iso/generated
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/info').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  inbox:
  generated:
